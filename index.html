<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>⌚ Watch Product Catalog</h1>

    <div class="filters">
        <button onclick="filterProducts('all')">All Watches</button>
        <button onclick="filterProducts('women')">Women's Watches</button>
        <button onclick="filterProducts('men')">Men's Watches</button>
        <button onclick="filterProducts('child')">Children's Watches</button>
    </div>

    <div class="products">

        <div class="product women">
            <img src="images/women1.jpg" alt="Women's Watch">
            <h3>Elegant Women's Watch</h3>
            <p>₹1,499</p>
        </div>

        <div class="product women">
            <img src="images/women2.jpg" alt="Women's Watch">
            <h3>Rose Gold Women's Watch</h3>
            <p>₹1,799</p>
        </div>
        <div class="product women">
            <img src="images/women3.jpg" alt="Women's Watch">
            <h3>Rose Gold Women's Watch</h3>
            <p>₹1,799</p>
        </div>
        <div class="product men">
            <img src="images/men1.jpg" alt="Men's Watch">
            <h3>Classic Men's Watch</h3>
            <p>₹2,499</p>
        </div>

        <div class="product men">
            <img src="images/men2.jpg" alt="Men's Watch">
            <h3>Black Men's Watch</h3>
            <p>₹2,999</p>
        </div>
                <div class="product men">
            <img src="images/men3.jpg" alt="Men's Watch">
            <h3>Black Men's Watch</h3>
            <p>₹2,999</p>
        </div>

        <div class="product child">
            <img src="images/child1.jpg" alt="Children's Watch">
            <h3>Kids Cartoon Watch</h3>
            <p>₹699</p>
        </div>

        <div class="product child">
            <img src="images/child2.jpg" alt="Children's Watch">
            <h3>Colorful Kids Watch</h3>
            <p>₹799</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
